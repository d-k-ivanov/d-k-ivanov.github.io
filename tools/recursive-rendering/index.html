<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <meta name="color-scheme" content="light">

    <title>Recursive Model Rendering</title>

    <style type="text/css">
        :root {
            --paper: #ece9df;
            --panel: #f8f7f2;
            --ink: #17201d;
            --muted: #68716c;
            --line: #a9afa8;
            --accent: #c54f32;
            --accent-hover: #a83d25;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            min-width: 320px;
            height: 100%;
            overflow: hidden;
            color: var(--ink);
            background-color: var(--paper);
            background-image:
                linear-gradient(rgba(23, 32, 29, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23, 32, 29, 0.045) 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: Bahnschrift, Aptos, "Trebuchet MS", sans-serif;
        }

        #render-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            height: 100dvh;
        }

        .toolbar {
            z-index: 2;
            border-bottom: 1px solid var(--ink);
            background: rgba(236, 233, 223, 0.96);
        }

        .toolbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            width: min(100%, 1600px);
            min-height: 72px;
            margin: 0 auto;
            padding: 12px 24px;
        }

        h1 {
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            font-weight: 700;
            line-height: 1.1;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
        }

        .grid-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-control {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 650;
        }

        .composite-control {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 650;
            white-space: nowrap;
            cursor: pointer;
        }

        .composite-control input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        select {
            width: 52px;
            min-height: 38px;
            padding: 6px 8px;
            border: 1px solid var(--ink);
            border-radius: 4px;
            color: var(--ink);
            background: var(--panel);
            font: inherit;
            cursor: pointer;
        }

        select:focus-visible {
            outline: 3px solid #e3a62f;
            outline-offset: 2px;
        }

        #status {
            color: var(--muted);
            font-size: 0.875rem;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        button {
            min-width: 132px;
            min-height: 42px;
            padding: 10px 16px;
            border: 1px solid var(--ink);
            border-radius: 4px;
            color: #fff;
            background: var(--accent);
            box-shadow: 3px 3px 0 var(--ink);
            font: 700 0.9rem/1 Bahnschrift, Aptos, "Trebuchet MS", sans-serif;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:focus-visible {
            outline: 3px solid #e3a62f;
            outline-offset: 3px;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink);
        }

        main {
            display: grid;
            grid-template-columns: repeat(var(--view-columns, 2), minmax(0, 1fr));
            grid-template-rows: repeat(var(--view-rows, 2), minmax(0, 1fr));
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: transparent;
        }

        .empty-state {
            display: grid;
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            min-height: 100%;
            padding: 40px 24px;
            place-items: center;
            color: var(--muted);
            background: rgba(248, 247, 242, 0.82);
            text-align: center;
        }

        .model-row {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
            min-height: 0;
            background: var(--panel);
            box-shadow: inset 0 0 0 1px var(--line);
            overflow: hidden;
        }

        .model-row.is-ready {
            background: transparent;
        }

        .model-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            min-height: 42px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--ink);
            background: var(--panel);
        }

        .model-title {
            min-width: 0;
            overflow: hidden;
            font-size: 0.9rem;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .model-state {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 0.75rem;
        }

        .model-viewport {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            background: var(--panel);
            cursor: grab;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        .model-row.is-ready .model-viewport {
            background: transparent;
        }

        .model-viewport.is-interacting {
            cursor: grabbing;
        }

        .model-viewport:focus-visible {
            outline: 3px solid #e3a62f;
            outline-offset: -3px;
        }

        .model-row.is-error .model-header {
            border-bottom: 0;
        }

        .model-row.is-error .model-state {
            color: #9b2f1b;
        }

        .model-error {
            padding: 16px;
            border-top: 1px solid var(--ink);
            color: #762817;
            background: #f8ded5;
            font: 0.8rem/1.45 Consolas, monospace;
            overflow-wrap: anywhere;
        }

        @media (max-width: 720px) {
            .toolbar-content {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
                padding: 12px 16px;
            }

            .controls {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                justify-content: stretch;
                gap: 10px;
            }

            #status {
                grid-column: 1 / -1;
            }

            .grid-controls {
                grid-column: 1 / -1;
            }

            main {
                width: 100%;
            }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <canvas id="render-canvas" aria-hidden="true"></canvas>

    <div class="app-shell">
        <header class="toolbar">
            <div class="toolbar-content">
                <h1>Recursive Model Rendering</h1>
                <div class="controls">
                    <span id="status" role="status" aria-live="polite">No folder selected</span>
                    <div class="grid-controls" role="group" aria-label="Viewport grid">
                        <label class="grid-control" for="row-count">
                            Rows
                            <select id="row-count">
                                <option value="1">1</option>
                                <option value="2" selected>2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </label>
                        <label class="grid-control" for="column-count">
                            Columns
                            <select id="column-count">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4" selected>4</option>
                            </select>
                        </label>
                    </div>
                    <label class="composite-control" for="composite-mode">
                        <input id="composite-mode" type="checkbox">
                        Combine by folder
                    </label>
                    <button id="folder-button" type="button">Select folder</button>
                    <input id="folder-input" type="file" accept=".stl,.drc,.draco,.ply,.vox,.obj" webkitdirectory directory multiple hidden>
                </div>
            </div>
        </header>

        <main id="models">
            <p class="empty-state">No models loaded</p>
        </main>
    </div>

    <script type="module" src="recursive-rendering.js"></script>
</body>

</html>
