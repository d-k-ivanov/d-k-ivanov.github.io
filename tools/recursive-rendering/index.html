<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <meta name="color-scheme" content="light">

    <title>Recursive Model Rendering</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <canvas id="render-canvas" aria-hidden="true"></canvas>

    <div class="app-shell">
        <header class="toolbar">
            <div class="toolbar-content">
                <h1>Recursive Model Rendering</h1>
                <div class="controls">
                    <span id="status" role="status" aria-live="polite">No folder selected</span>
                    <div class="grid-controls" role="group" aria-label="Viewport grid">
                        <label class="grid-control" for="row-count">
                            Rows
                            <select id="row-count">
                                <option value="1">1</option>
                                <option value="2" selected>2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </label>
                        <label class="grid-control" for="column-count">
                            Columns
                            <select id="column-count">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4" selected>4</option>
                            </select>
                        </label>
                    </div>
                    <label class="composite-control" for="composite-mode">
                        <input id="composite-mode" type="checkbox">
                        Combine by folder
                    </label>
                    <button id="folder-button" type="button">Select folder</button>
                    <input id="folder-input" type="file" accept=".stl,.drc,.draco,.ply,.vox,.obj" webkitdirectory directory multiple hidden>
                </div>
            </div>
        </header>

        <main id="models">
            <p class="empty-state">No models loaded</p>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
